version: '3.8'

services:
  corporate-web:
    build:
      context: ./corporate-web
      dockerfile: Dockerfile
    container_name: mitsui_corporate_web
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://localhost:8080

  admin-cms:
    build:
      context: ./admin-cms
      dockerfile: Dockerfile
    container_name: mitsui_admin_cms
    restart: always
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://localhost:8080
